{# Eén lichtbak voor elke pagina. Een foto (ook HEIC) opent hierin; een PDF
   blijft een gewone link naar een tabblad. In de zijbalk van Home Assistant
   heeft een nieuw venster de cookie niet, dus de foto blijft op deze pagina. #}
<style>
  .lichtbak {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: rgba(0, 0, 0, .88);
    /* Ruimte voor het kruis boven en de pijlen opzij, anders vallen die over de foto. */
    padding: 64px 60px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lichtbak[hidden] { display: none; }
  .lichtbak img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .lichtbak-sluit,
  .lichtbak-vorige,
  .lichtbak-volgende {
    position: absolute;
    z-index: 2;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 22px;
    background: rgba(255, 255, 255, .16);
    color: #fff;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  /* display:flex hierboven wint van het hidden-attribuut. Zonder deze regel
     blijven vorige en volgende in de tabvolgorde als er maar één foto is. */
  .lichtbak-vorige[hidden],
  .lichtbak-volgende[hidden] { display: none; }
  .lichtbak-sluit { top: 12px; right: 12px; }
  .lichtbak-vorige { left: 8px; top: 50%; margin-top: -22px; }
  .lichtbak-volgende { right: 8px; top: 50%; margin-top: -22px; }
  .lichtbak-sluit:focus,
  .lichtbak-vorige:focus,
  .lichtbak-volgende:focus {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
</style>

<div id="lichtbak" class="lichtbak" hidden role="dialog" aria-modal="true" aria-label="">
  <button type="button" class="lichtbak-sluit" data-sluit aria-label="Sluiten">×</button>
  <button type="button" class="lichtbak-vorige" data-stap="-1" aria-label="Vorige foto" hidden>‹</button>
  <button type="button" class="lichtbak-volgende" data-stap="1" aria-label="Volgende foto" hidden>›</button>
  <img id="lichtbak-foto" alt="">
</div>

<script>
  (function () {
    var bak = document.getElementById('lichtbak');
    var img = document.getElementById('lichtbak-foto');
    var sluitknop = bak && bak.querySelector('[data-sluit]');
    var vorige = bak && bak.querySelector('[data-stap="-1"]');
    var volgende = bak && bak.querySelector('[data-stap="1"]');
    if (!bak || !img || !sluitknop || !vorige || !volgende) return;
    var geopendVanaf = null;
    var raak = null;

    function fotos() {
      return Array.prototype.slice.call(document.querySelectorAll('a[data-soort="foto"]'));
    }

    function focusbaar() {
      return Array.prototype.filter.call(
        bak.querySelectorAll(
          'button, a[href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
        ),
        function (el) { return !el.hidden; }
      );
    }

    function sluit() {
      if (bak.hidden) return;
      // Weghalen, anders blijft Escape de lichtbak claimen terwijl die al
      // dicht is en de menu's niet meer sluit.
      document.removeEventListener('keydown', opToets, true);
      bak.hidden = true;
      img.removeAttribute('src');
      vorige.hidden = true;
      volgende.hidden = true;
      var terug = geopendVanaf;
      geopendVanaf = null;
      if (terug) terug.focus();
    }

    function zetFoto(link, focusSluiten) {
      var lijst = fotos();
      var index = lijst.indexOf(link);
      if (index < 0) {
        if (!lijst.length) return;
        index = 0;
      }
      var gekozen = lijst[index];
      geopendVanaf = gekozen;
      var naam = gekozen.getAttribute('data-naam') || 'Foto';
      bak.setAttribute('aria-label', naam);
      img.alt = naam;
      img.src = gekozen.getAttribute('href');
      var meer = lijst.length > 1;
      vorige.hidden = !meer;
      volgende.hidden = !meer;
      if (bak.hidden) {
        bak.hidden = false;
        document.removeEventListener('keydown', opToets, true);
        document.addEventListener('keydown', opToets, true);
      }
      if (focusSluiten) sluitknop.focus();
    }

    function stap(delta) {
      var lijst = fotos();
      if (lijst.length < 2 || !geopendVanaf) return;
      var index = lijst.indexOf(geopendVanaf);
      if (index < 0) index = 0;
      var nieuw = (index + delta) % lijst.length;
      if (nieuw < 0) nieuw += lijst.length;
      zetFoto(lijst[nieuw], false);
    }

    // De toetsen horen bij het document, niet bij de lichtbak. Een tik op de
    // foto zelf zet de focus op de pagina: een plaatje is niet te focussen,
    // en dan bereikt Escape een listener op de lichtbak niet meer. De
    // listener staat er alleen zolang de foto open is.
    function opToets(ev) {
      if (ev.key === 'Escape') {
        ev.preventDefault();
        ev.stopPropagation();
        sluit();
        return;
      }
      if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
        ev.preventDefault();
        stap(ev.key === 'ArrowLeft' ? -1 : 1);
        return;
      }
      if (ev.key !== 'Tab') return;
      var lijst = focusbaar();
      if (!lijst.length) return;
      var eerste = lijst[0];
      var laatste = lijst[lijst.length - 1];
      var binnen = bak.contains(document.activeElement);
      if (ev.shiftKey && (!binnen || document.activeElement === eerste)) {
        ev.preventDefault();
        laatste.focus();
      } else if (!ev.shiftKey && (!binnen || document.activeElement === laatste)) {
        ev.preventDefault();
        eerste.focus();
      }
    }

    // Alleen een link naar een foto. Een vinkje, verwijderen of een PDF is
    // geen zo'n link, anders opent een tik om iets uit te vinken de foto.
    document.querySelectorAll('a[data-soort="foto"]').forEach(function (link) {
      link.addEventListener('click', function (ev) {
        if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || ev.button !== 0) return;
        ev.preventDefault();
        zetFoto(link, true);
      });
    });

    bak.addEventListener('click', function (ev) {
      var knop = ev.target.closest ? ev.target.closest('[data-stap]') : null;
      if (knop) {
        stap(Number(knop.getAttribute('data-stap')));
        return;
      }
      if (ev.target === bak || (ev.target.closest && ev.target.closest('[data-sluit]'))) sluit();
    });

    // Vegen op een iPhone: naar links is de volgende foto. Een tik op een
    // knop telt niet mee, anders springt de foto terwijl je hem sluit.
    bak.addEventListener('touchstart', function (ev) {
      if (ev.touches.length !== 1 || (ev.target.closest && ev.target.closest('button'))) {
        raak = null;
        return;
      }
      raak = {x: ev.touches[0].clientX, y: ev.touches[0].clientY};
    }, {passive: true});
    bak.addEventListener('touchend', function (ev) {
      if (!raak || !ev.changedTouches.length) { raak = null; return; }
      var dx = ev.changedTouches[0].clientX - raak.x;
      var dy = ev.changedTouches[0].clientY - raak.y;
      raak = null;
      if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy)) return;
      stap(dx < 0 ? 1 : -1);
    });
  })();
</script>
