<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#03a9f4">
<title>{% block title %}Rekeningen{% endblock %} · Facturen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f2329'/%3E%3Crect x='7' y='6' width='18' height='20' rx='2' fill='%23fff'/%3E%3Cg fill='%239aa0a8'%3E%3Crect x='10' y='10' width='12' height='2' rx='1'/%3E%3Crect x='10' y='14' width='12' height='2' rx='1'/%3E%3Crect x='10' y='18' width='7' height='2' rx='1'/%3E%3C/g%3E%3Crect x='10' y='22' width='12' height='2.5' rx='1.25' fill='%2303a9f4'/%3E%3C/svg%3E">
<style>
  /* ===================================================================
     Facturen App — visuele taal van Home Assistant, zodat de app zowel
     in de HA-zijbalk als los in de browser thuishoort.
     =================================================================== */
  :root {
    --primary: #03a9f4;
    --primary-hover: #0288d1;
    --primary-soft: #e7f5fd;
    --on-primary: #ffffff;

    --bg: #f2f4f7;
    --card: #ffffff;
    --text: #1f2329;
    --text-secondary: #6b7280;
    --divider: #eceef1;
    --border: #dde1e6;
    --input-bg: #ffffff;

    --ok: #2e7d43;
    --ok-soft: #e4f4e8;
    --info: #0277a8;
    --info-soft: #e1f3fb;
    --neutral: #5d636d;
    --neutral-soft: #eceef1;
    --danger: #c62828;
    --danger-soft: #fdeaea;
    --warn-bg: #fff8e1;
    --warn-border: #ffd54f;
    --warn-text: #6b5400;

    --shadow-card: 0 1px 3px rgba(0, 0, 0, .11);
    --shadow-raised: 0 2px 6px rgba(0, 0, 0, .16);
    --radius: 12px;
    --radius-sm: 8px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #33b1f0;
      --primary-hover: #4fc0f7;
      --primary-soft: #16232c;
      --on-primary: #06222f;

      --bg: #111417;
      --card: #1c1f26;
      --text: #e6e8eb;
      --text-secondary: #9aa1ab;
      --divider: #262a32;
      --border: #333844;
      --input-bg: #14171c;

      --ok: #6cc48a;
      --ok-soft: #16281c;
      --info: #64c4ec;
      --info-soft: #10242e;
      --neutral: #9aa1ab;
      --neutral-soft: #262a32;
      --danger: #ef6c6c;
      --danger-soft: #2d1a1a;
      --warn-bg: #2a2311;
      --warn-border: #7a6420;
      --warn-text: #e8cf88;

      --shadow-card: 0 1px 3px rgba(0, 0, 0, .5);
      --shadow-raised: 0 2px 8px rgba(0, 0, 0, .6);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Kopbalk met tabbladen ---------- */
  .appbar {
    background: var(--card);
    box-shadow: var(--shadow-card);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .appbar-inner {
    max-width: 940px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 20px;
    min-height: 56px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    text-decoration: none;
    letter-spacing: -.01em;
    margin-right: auto;
  }
  .brand svg { display: block; }
  .tabs { display: flex; gap: 4px; }
  .tabs a {
    display: block;
    padding: 17px 14px 15px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tabs a:hover { color: var(--text); }
  .tabs a.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* ---------- Inhoud ---------- */
  .container {
    max-width: 940px;
    margin: 0 auto;
    padding: 24px 16px 56px;
  }
  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -.015em;
    margin: 0;
  }
  h2 {
    font-size: 17px;
    font-weight: 500;
    margin: 0 0 4px;
    letter-spacing: -.01em;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 18px 20px;
  }
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card-head { margin-bottom: 14px; }
  .card-head p { margin: 0; color: var(--text-secondary); font-size: 13.5px; }

  /* ---------- Formulieren ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .fields { display: flex; flex-direction: column; gap: 16px; }
  label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-family: inherit;
    background: var(--input-bg);
    color: var(--text);
  }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
  input[type="file"] { padding: 8px; font-size: 14px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > * { flex: 1 1 200px; min-width: 0; }
  .hint { color: var(--text-secondary); font-size: 13px; margin: 0; }

  /* ---------- Knoppen ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    padding: 10px 20px;
    border-radius: 22px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn:focus-visible, .tabs a:focus-visible, .link:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
  .btn-text {
    background: transparent;
    color: var(--primary);
    padding: 7px 12px;
    border-radius: var(--radius-sm);
    font-size: 13px;
  }
  .btn-text:hover { background: var(--primary-soft); }
  .btn-text.danger { color: var(--danger); }
  .btn-text.danger:hover { background: var(--danger-soft); }
  .btn-outline {
    background: transparent;
    color: var(--primary);
    border: 1px solid var(--border);
  }
  .btn-outline:hover { background: var(--primary-soft); }
  .link { color: var(--primary); }

  /* ---------- Statuschip ---------- */
  .chip {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 500;
    padding: 3px 11px;
    border-radius: 12px;
    white-space: nowrap;
  }
  .chip-concept { background: var(--neutral-soft); color: var(--neutral); }
  .chip-verzonden { background: var(--info-soft); color: var(--info); }
  .chip-betaald { background: var(--ok-soft); color: var(--ok); }

  /* ---------- Melding ---------- */
  .flash {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-text);
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
    font-size: 14px;
  }

  .empty { text-align: center; padding: 40px 20px; }
  .empty p { color: var(--text-secondary); margin: 0 0 18px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>

<header class="appbar">
  <div class="appbar-inner">
    <a class="brand" href="{{ url_for('index') }}">
      <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="currentColor" opacity=".12"></rect>
        <rect x="8" y="6" width="16" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"></rect>
        <path d="M12 12h8M12 16h8M12 20h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
      </svg>
      Facturen
    </a>
    <nav class="tabs">
      <a href="{{ url_for('index') }}" {% if actief in ['index', 'nieuw'] %}class="active"{% endif %}>Rekeningen</a>
      <a href="{{ url_for('instellingen') }}" {% if actief == 'instellingen' %}class="active"{% endif %}>Instellingen</a>
    </nav>
  </div>
</header>

<main class="container">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}
        <div class="flash">{{ m }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>

</body>
</html>
