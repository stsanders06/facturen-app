---
name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # De add-on heeft bewust geen 'image' in config.yaml, zodat de Supervisor
      # hem lokaal bouwt bij installatie. De builder wil wel een naam voor de
      # test-tag; die geven we hier mee. Met --test wordt er niets gepusht.
      - name: Test build voor ${{ matrix.arch }}
        uses: home-assistant/builder@master
        with:
          args: |
            --test \
            --${{ matrix.arch }} \
            --target /data/facturen_app \
            --docker-hub local \
            --image "{arch}-addon-facturen-app"

  smoke-test:
    name: Smoke test (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bouw het amd64 image
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20 \
            --tag facturen-app:test \
            ./facturen_app

      # Draait de container zoals de Supervisor dat doet: /data gemount met
      # options.json erin, en controleert of de webinterface antwoordt.
      - name: Start de add-on en controleer de webinterface
        run: |
          mkdir -p /tmp/addon-data
          echo '{"log_level": "debug"}' > /tmp/addon-data/options.json
          # De Ingress-header telt alleen mee als het verzoek uit het netwerk van
          # Home Assistant komt. In deze test komt curl van de Docker-brug, dus dat
          # netwerk geven we hier mee; in Home Assistant zelf blijft de standaard
          # (172.30.32.0/23) gelden en is dit niet gezet.
          docker run -d --name facturen-test \
            -v /tmp/addon-data:/data \
            -p 8099:8099 \
            -e INGRESS_NETWERK=172.16.0.0/12 \
            facturen-app:test

          # Wachten tot de app antwoordt. Dat doen we via de Ingress-header, want
          # poort 8099 zit achter een inlog en stuurt zonder account door naar het
          # instelscherm; daar valt niet aan te zien of de app echt draait.
          for i in $(seq 1 30); do
            if curl -fsS -H "X-Ingress-Path: /api/hassio_ingress/xyz" \
                 http://localhost:8099/ > /tmp/ingress.html; then
              echo "Webinterface antwoordt na ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Add-on antwoordde niet binnen 30 seconden"
              docker logs facturen-test
              exit 1
            fi
            sleep 1
          done

          grep -q "Rekeningen" /tmp/ingress.html \
            || { echo "::error::Onverwachte pagina-inhoud"; cat /tmp/ingress.html; exit 1; }

          # Ingress: links moeten het doorgegeven pad-prefix krijgen
          grep -q 'href="/api/hassio_ingress/xyz/nieuw"' /tmp/ingress.html \
            || { echo "::error::Ingress-prefix ontbreekt in de links"; exit 1; }
          echo "Ingress-prefix correct toegepast"

          # Poort 8099 hoort dicht te zitten zolang er geen account is: wie daar
          # binnenkomt moet eerst een gebruikersnaam en wachtwoord kiezen.
          curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
            http://localhost:8099/ > /tmp/direct.txt
          grep -qE '^302 .*/instellen$' /tmp/direct.txt \
            || { echo "::error::Poort 8099 vraagt niet om in te loggen"; \
                 cat /tmp/direct.txt; exit 1; }

          curl -fsS http://localhost:8099/instellen > /tmp/instellen.html
          grep -q "Kies je inloggegevens" /tmp/instellen.html \
            || { echo "::error::Instelscherm ontbreekt"; cat /tmp/instellen.html; exit 1; }
          echo "Inlog op poort 8099 werkt"

          # En de header alleen mag de inlog niet openbreken: hij telt pas als het
          # verzoek uit het netwerk van Home Assistant komt. Dit was een gat waarmee
          # iedereen op het netwerk zonder wachtwoord binnenkwam.
          docker rm -f facturen-test >/dev/null
          docker run -d --name facturen-test \
            -v /tmp/addon-data:/data -p 8099:8099 facturen-app:test
          for i in $(seq 1 30); do
            curl -sS -o /dev/null http://localhost:8099/instellen && break
            sleep 1
          done
          curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
            -H "X-Ingress-Path: /api/hassio_ingress/xyz" \
            http://localhost:8099/ > /tmp/nagemaakt.txt
          grep -qE '^302 .*/instellen$' /tmp/nagemaakt.txt \
            || { echo "::error::Een nagemaakte Ingress-header komt langs de inlog"; \
                 cat /tmp/nagemaakt.txt; exit 1; }
          echo "Nagemaakte Ingress-header wordt geweigerd"

          docker logs facturen-test

      - name: Ruim op
        if: always()
        run: docker rm -f facturen-test || true

  zelfstandig:
    name: Zelfstandig (docker compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Precies wat DOCKER.md op de Raspberry Pi laat doen, met een lege map data.
      - name: Bouw en start met docker compose
        run: |
          cp .env.example .env
          mkdir -p data
          # Zelfs met INGRESS_NETWERK op het hele Docker-bereik mag een
          # Ingress-header als losse container niet langs de inlog.
          cat > /tmp/ingress-poging.yml <<'YAML'
          services:
            facturen:
              environment:
                INGRESS_NETWERK: 172.16.0.0/12
          YAML
          docker compose -f docker-compose.yml -f /tmp/ingress-poging.yml up -d --build
          for i in $(seq 1 30); do
            curl -sS -o /dev/null http://localhost:8099/instellen && break
            if [ "$i" -eq 30 ]; then
              echo "::error::De container antwoordde niet binnen 30 seconden"
              docker compose logs
              exit 1
            fi
            sleep 1
          done

      - name: Controleer inlog, pagina's en wachtwoord herstellen
        run: |
          B=http://localhost:8099
          fout() { echo "::error::$1"; docker compose logs; exit 1; }

          curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' $B/ > /tmp/direct.txt
          grep -qE '^302 .*/instellen$' /tmp/direct.txt || fout "Zonder account geen instelscherm"

          curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
            -H "X-Ingress-Path: /api/hassio_ingress/xyz" $B/ > /tmp/nagemaakt.txt
          grep -qE '^302 http://localhost:8099/instellen$' /tmp/nagemaakt.txt \
            || fout "Een Ingress-header komt langs de inlog of verandert het pad: $(cat /tmp/nagemaakt.txt)"

          curl -fsS $B/instellen > /tmp/instellen.html
          grep -q "Home Assistant" /tmp/instellen.html && fout "Instelscherm noemt Home Assistant"

          token() { grep -o 'name="csrf_token" value="[^"]*"' | head -1 | sed 's/.*value="//;s/"$//'; }
          TOK=$(curl -sS -c /tmp/k $B/instellen | token)
          curl -sS -b /tmp/k -c /tmp/k -o /dev/null --data-urlencode "csrf_token=$TOK" \
            -d "naam=testgebruiker&wachtwoord=geheim123&nogmaals=geheim123" $B/instellen
          for p in / /vandaag /klanten /klussen /offertes /scans /instellingen; do
            code=$(curl -sS -b /tmp/k -o /tmp/pagina.html -w '%{http_code}' $B$p)
            [ "$code" = "200" ] || fout "$p gaf $code"
          done
          grep -q "$B/api/scans" /tmp/pagina.html || fout "Scanadres ontbreekt in Instellingen"
          echo "Pagina's werken"

          printf 'nieuw-geheim\nnieuw-geheim\n' \
            | docker compose exec -T facturen wachtwoord-herstellen | tee /tmp/herstel.txt
          grep -q "Log in als testgebruiker" /tmp/herstel.txt || fout "Wachtwoord herstellen mislukt"
          TOK=$(curl -sS -c /tmp/k2 $B/inloggen | token)
          curl -sS -b /tmp/k2 -c /tmp/k2 -o /dev/null --data-urlencode "csrf_token=$TOK" \
            -d "naam=testgebruiker&wachtwoord=nieuw-geheim" $B/inloggen
          code=$(curl -sS -b /tmp/k2 -o /dev/null -w '%{http_code}' $B/klanten)
          [ "$code" = "200" ] || fout "Inloggen met het herstelde wachtwoord lukt niet"
          echo "Wachtwoord herstellen werkt"

          # De app draait als PUID 1000, niet als root, en de data is van die gebruiker.
          [ "$(stat -c %u data/facturen.db)" = "1000" ] || fout "data/facturen.db is niet van 1000"
          docker compose exec -T facturen sh -c 'ps -o user,args' | grep -E '^1000 .*main.py' \
            || fout "De app draait niet als gebruiker 1000"
          docker compose logs

      # De Raspberry Pi is arm64; bouwen via QEMU vangt een pakket dat daar ontbreekt.
      - name: QEMU voor arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bouw voor arm64 (Raspberry Pi)
        run: |
          docker buildx build --platform linux/arm64 \
            -f facturen_app/Dockerfile.standalone \
            --tag facturen-app:arm64 --load ./facturen_app
          docker run --rm --platform linux/arm64 --entrypoint python3 facturen-app:arm64 \
            -c "import platform, reportlab, waitress; print(platform.machine())" | grep -qx aarch64

      - name: Ruim op
        if: always()
        run: docker compose down || true
