---
name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint-addon:
    name: Add-on configuratie
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Home Assistant add-on lint
        uses: frenck/action-addon-linter@v2
        with:
          path: "./facturen_app"

  lint-hadolint:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./facturen_app/Dockerfile
          config: ./.hadolint.yaml

  lint-yaml:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: yamllint
        uses: frenck/action-yamllint@v1

  tests:
    name: Tests
    runs-on: ubuntu-latest
    # De suite is seconden. Een hangende browser-installatie mag de job niet
    # een uur vasthouden; een kwartier is ruim voor Chromium uit de cache.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakketten installeren
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install -r facturen_app/app/requirements.txt
          pip install -r facturen_app/tests/requirements.txt

      - name: Browsercache
        id: browsercache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('facturen_app/tests/requirements.txt') }}

      # Alleen Chromium, en alleen als de cache leeg is. WebKit met
      # --with-deps installeerde een minutenlange lading systeempakketten
      # en de job bleef daarop hangen. Zonder WebKit slaan die tests over.
      # De inbox-test tekent met Chromium of de Chrome van de runner.
      - name: Chromium
        if: steps.browsercache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Pytest
        run: pytest
